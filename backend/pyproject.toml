[project]
name = "slm-kit"
version = "0.1.0"
description = "Self-hosted platform for the full small-language-model lifecycle on a single-GPU workstation."
readme = "README.md"
requires-python = ">=3.11"

# Base install: runs the FastAPI API, the SQLite registry, hardware polling,
# the fallback VRAM estimator, HF Hub listing/publishing, and dataset validation.
# It does NOT require CUDA/torch, so the UI + non-GPU features work anywhere.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
    "psutil>=5.9",
    "nvidia-ml-py>=12.535",       # pynvml: GPU telemetry (no-ops gracefully with no NVIDIA GPU)
    "huggingface-hub>=0.23",
    "httpx>=0.27",
]

[project.optional-dependencies]
# GPU/training stack. Install INSIDE WSL2 with CUDA available:
#   uv pip install -e ".[gpu]"
# Kept optional so the core API is installable on a machine without CUDA.
#
# NATIVE WINDOWS: PyPI's Windows torch wheels are CPU-only. Install the CUDA
# build FIRST, from the PyTorch index, then the rest:
#   pip install "torch==2.11.0" torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
#   pip install -e ".[gpu]"
# Keep this range aligned with the tested Docker compatibility matrix.
gpu = [
    "torch>=2.11,<2.12",
    "transformers>=4.43,<4.58",
    "datasets>=2.20,<5.1",
    "tokenizers>=0.19,<0.23",
    "accelerate>=0.31,<1.16",
    "peft>=0.11,<0.21",
    "trl>=0.9,<0.24",
    "bitsandbytes>=0.43,<0.51",
    "unsloth>=2024.8",
    "sentencepiece>=0.2",
]
# Evaluation metrics (light enough to keep separate from the GPU stack).
eval = [
    "rouge-score>=0.1.2",
    "sacrebleu>=2.4",
    "nltk>=3.8",
]
# Optional: warm, persistent Playground serving via vLLM's OpenAI-compatible
# server instead of per-request transformers reload. Linux/WSL2 only — vLLM's
# GPU wheels aren't published for native Windows. Fully optional: without it,
# SLMKIT_SERVE_ENGINE=auto (the default) silently uses the transformers path.
vllm = [
    "vllm>=0.5",
]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B904", "UP042"]
